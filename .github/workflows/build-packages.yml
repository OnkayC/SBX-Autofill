name: Build release packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/build-packages.yml'
      - 'scripts/package-release.py'
      - 'src/**'
      - 'tests/**'
      - 'package*.json'
      - 'webpack.config.js'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Chrome
        run: npm run build:chrome -- --output-clean
      - name: Build Firefox
        run: npm run build:firefox -- --output-clean
      - name: Package both browsers and source
        run: python3 scripts/package-release.py
      - name: Upload release packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbx-autofill-packages-${{ github.sha }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30
